[env:esp32s3]
; Requiere Arduino-ESP32 3.x (usa driver/pulse_cnt.h y ledcAttach): pioarduino, no el espressif32 oficial 6.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Serial = UART0 (puerto "COM"/UART de la placa, el que usas: COM8).
; Si conectas al puerto "USB" nativo, añade -DARDUINO_USB_CDC_ON_BOOT=1.
build_flags =
  -DCORE_DEBUG_LEVEL=0
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter, esp32_exception_decoder
