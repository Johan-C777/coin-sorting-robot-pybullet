[env:esp32s3]
platform = espressif32             ; probado con 7.x (Arduino-ESP32 3.x); también compila con 6.x
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; USB nativo como Serial (puerto "USB"). Si usas el puerto "UART", quita esta línea.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  madhephaestus/ESP32Servo@^3.0.5
