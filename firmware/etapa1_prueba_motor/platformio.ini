[env:esp32s3]
platform = espressif32@6.9.0       ; Arduino-ESP32 2.0.17 (estable)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; USB nativo como Serial (puerto "USB"). Si usas el puerto "UART", quita esta línea.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  madhephaestus/ESP32Servo@^1.2.1
  adafruit/Adafruit TCS34725@^1.4.4
