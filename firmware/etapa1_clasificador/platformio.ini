; Módulo clasificador de monedas (etapa 1) · ESP32-S3-DevKitC-1 · Arduino sobre ESP-IDF
;   pio run -e esp32s3 -t upload && pio device monitor     firmware
;   pio test -e native                                      pruebas en el PC (sin placa)

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; USB nativo como Serial (puerto "USB"). Si usas el puerto "UART", quita ARDUINO_USB_CDC_ON_BOOT.
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"0.9.0\"
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.5
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -O1

; Banda movida por una RAMBo con Marlin (G-code por UART1, GPIO 41 TX / 42 RX)
;   pio run -e esp32s3_rambo -t upload
[env:esp32s3_rambo]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DBANDA_RAMBO=1

; Consola por el puerto UART (chip CH343) en lugar del USB nativo
;   pio run -e esp32s3_uart -t upload
[env:esp32s3_uart]
extends = env:esp32s3
build_unflags = ${env.build_unflags} -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"0.9.0\"

; Solo etapa 1 (sin banda), consola por el puerto UART (CH343)
[env:esp32s3_uart_etapa1]
extends = env:esp32s3_uart
build_flags = ${env:esp32s3_uart.build_flags} -DHABILITAR_BANDA=0

; Igual, midiendo con un solo haz IR (j1/j2 elige GPIO 1 o 2, y<mm/s> o q<vaso> calibra la velocidad)
[env:esp32s3_uart_etapa1_1ir]
extends = env:esp32s3_uart
build_flags = ${env:esp32s3_uart.build_flags} -DHABILITAR_BANDA=0 -DUNA_BARRERA=1

; Etapas 1 y 2: banda en la RAMBo por UART1 (GPIO 41/42), consola por el puerto UART y un solo haz IR
[env:esp32s3_uart_rambo_1ir]
extends = env:esp32s3_uart
build_flags = ${env:esp32s3_uart.build_flags} -DBANDA_RAMBO=1 -DUNA_BARRERA=1
