; Módulo clasificador de monedas (etapa 1) · ESP32-S3-DevKitC-1 · Arduino sobre ESP-IDF
;   pio run -e esp32s3 -t upload && pio device monitor     firmware
;   pio test -e native                                      pruebas en el PC (sin placa)

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; USB nativo como Serial (puerto "USB"). Si usas el puerto "UART", quita ARDUINO_USB_CDC_ON_BOOT.
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"0.8.0\"
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.5
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -O1
