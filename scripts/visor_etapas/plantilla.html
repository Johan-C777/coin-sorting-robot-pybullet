<title>Clasificador de Monedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Banco de taller: el modelo ocupa el escenario; controles en una regleta inferior y la lista de electrónica al costado. */
:root{
  --bg:#e9edf1; --panel:#f8fafb; --ink:#14191e; --ink2:#5b6670; --line:#cbd3da;
  --accent:#1f6fd6; --accent-ink:#ffffff; --stage:#d9e0e6; --stage2:#f3f5f7; --chip:#14191e; --chip-ink:#ffffff; --sel:#f2b01e;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --panel:#151c22; --ink:#e6edf2; --ink2:#93a1ad; --line:#2a353f;
  --accent:#4b95f0; --accent-ink:#06121f; --stage:#10171d; --stage2:#1d2731; --chip:#e6edf2; --chip-ink:#0e1317; --sel:#f2b01e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --panel:#151c22; --ink:#e6edf2; --ink2:#93a1ad; --line:#2a353f;
  --accent:#4b95f0; --accent-ink:#06121f; --stage:#10171d; --stage2:#1d2731; --chip:#e6edf2; --chip-ink:#0e1317; --sel:#f2b01e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:700 22px/1.1 var(--f-disp);letter-spacing:.01em;margin:0;text-wrap:balance}
.tag{font:500 12px var(--f-mono);color:var(--ink2);letter-spacing:.04em}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,var(--stage2),var(--stage))}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
#lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;will-change:transform}
.lb .t{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--chip-ink);font:600 12px/1 var(--f-body);padding:4px 8px 4px 4px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lb .n{font:500 11px/1 var(--f-mono);background:var(--sel);color:#14191e;border-radius:2px;padding:3px 4px;min-width:14px;text-align:center}
.lb .s{width:1px;height:18px;background:var(--chip)}
.lb .d{width:7px;height:7px;border-radius:50%;background:var(--sel);border:1.5px solid var(--chip)}
.lb.mini .t{padding:0;background:transparent;box-shadow:none}.lb.mini .t span:not(.n){display:none}
.lb.pz .t{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.lb.pz .n{display:none}.lb.pz .t{padding:4px 8px}
.lb.pz .s{background:var(--ink2)}.lb.pz .d{background:var(--panel);border-color:var(--ink2)}
.lb.on .t{outline:2px solid var(--sel)}
.card{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;max-width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.card b{font:600 15px/1.25 var(--f-disp);letter-spacing:.01em;display:block}
.card .k{font:400 12px/1.5 var(--f-mono);color:var(--ink2);margin-top:4px}
.card .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.hint{position:absolute;right:12px;top:10px;font:400 11px var(--f-mono);color:var(--ink2)}
aside{grid-row:2/4;grid-column:2;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;padding-block:12px;padding-inline:14px}
aside h2{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:6px 0 8px}
.el{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;align-items:baseline;padding:6px 6px;border-radius:3px;cursor:pointer;border:1px solid transparent}
.el:hover,.el:focus-visible{border-color:var(--line);outline:none}
.el.on{background:color-mix(in srgb,var(--sel) 18%,transparent);border-color:var(--sel)}
.el .n{font:500 11px/1.6 var(--f-mono);background:var(--sel);color:#14191e;border-radius:2px;text-align:center}
.el .nm{font:600 13px/1.3 var(--f-body)}
.el .pn{grid-column:2;font:400 11.5px/1.45 var(--f-mono);color:var(--ink2)}
.sec{margin-top:16px}
.fil{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 8px;font:400 12.5px/1.4 var(--f-body);align-items:center}
.fil i{width:14px;height:14px;border-radius:2px;border:1px solid var(--line)}
nav{grid-column:1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;border-top:1px solid var(--line);background:var(--panel);padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.grp>span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:4px}
button{font:500 12.5px/1 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 10px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sq{padding:7px 8px;min-width:30px;font-family:var(--f-mono)}
.u{display:flex;align-items:center;gap:8px}
.u input{width:170px;accent-color:var(--accent)}
.u output{font:500 12px var(--f-mono);color:var(--ink2);min-width:62px;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 58vh auto auto;height:auto}
  html,body{height:auto}
  aside{grid-row:auto;grid-column:1;border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .u input{width:130px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
  <header>
    <h1>Clasificador de monedas</h1>
    <span class="tag">ETAPA 1 TOLVA Y SELECCIÓN · ETAPA 2 BANDA TRANSPORTADORA</span>
  </header>
  <div class="stage" id="stage">
    <div id="lbl"></div>
    <div class="hint" id="hint">arrastra para girar · rueda o pellizco para acercar · toca una pieza</div>
    <div class="card" id="card" hidden></div>
  </div>
  <nav aria-label="Controles del visor">
    <div class="grp"><span>Vista</span><div class="row" id="vistas">
      <button id="v-iso" aria-pressed="true">Isométrica</button><button id="v-fre">Frente</button><button id="v-atr">Atrás</button><button id="v-lad">Lado</button><button id="v-arr">Arriba</button>
      <button id="v-tol">Tolva</button><button id="v-ban">Motor banda</button><button id="v-ele">Electrónica</button>
    </div></div>
    <div class="grp"><span>Mostrar</span><div class="row">
      <button id="t-e1" aria-pressed="true">Etapa 1</button><button id="t-e2" aria-pressed="true">Etapa 2</button><button id="t-el" aria-pressed="true">Electrónica</button>
      <button id="t-ca" aria-pressed="true">Cables</button><button id="t-no" aria-pressed="true">Nombres</button><button id="t-pz" aria-pressed="false">Piezas</button>
      <button id="t-rx" aria-pressed="false">Rayos X</button><button id="t-me" aria-pressed="true">Mesa</button>
    </div></div>
    <div class="grp"><span>Cartucho</span><div class="row" id="vasos"></div></div>
    <div class="grp"><span>Movimiento</span><div class="row">
      <button id="m-demo" aria-pressed="false">Ciclo automático</button><button id="m-disco" aria-pressed="false">Girar disco</button><button id="m-comp" aria-pressed="false">Abrir compuerta</button>
      <div class="u"><input type="range" id="u" min="0" max="774" step="1" value="0" aria-label="Posición del carro en milímetros"><output id="uo">0 mm</output></div>
      <button id="m-full">Pantalla completa</button>
    </div></div>
  </nav>
  <aside>
    <h2>Electrónica</h2>
    <div id="lista"></div>
    <div class="sec"><h2>Filamentos</h2><div class="fil" id="fil"></div></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = /*DATOS*/null;
const $ = id => document.getElementById(id);
const b64 = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- materiales (colores de los filamentos del montaje)
const MAT = {
  negro:{c:0x1d1f23,r:.62,m:0}, azul:{c:0x1f6fd6,r:.34,m:0}, verde:{c:0x45d77e,r:.5,m:0}, marmol:{c:0xd3d6db,r:.42,m:.12},
  aluminio:{c:0xc6cace,r:.32,m:.85}, acero:{c:0xb3b8be,r:.38,m:.8}, negro_mate:{c:0x232528,r:.7,m:0}, plastico_azul:{c:0x2c63cf,r:.4,m:0},
  plastico_azul_t:{c:0x3557d8,r:.25,m:0,o:.78}, blanco:{c:0xf1f1ee,r:.5,m:0}, led_ir:{c:0xa9c3ff,r:.1,m:0,o:.7}, negro_led:{c:0x0f1012,r:.3,m:0},
  pcb_azul:{c:0x1c4aa3,r:.45,m:0}, blanco_led:{c:0xfffbea,r:.2,m:0,e:0x666655}, oro:{c:0xd2a63a,r:.3,m:.9}, pcb_negro:{c:0x15191e,r:.5,m:0},
  amarillo:{c:0xf0c02c,r:.5,m:0}, rojo:{c:0xd0362a,r:.5,m:0}, led_rgb:{c:0x7cf,r:.2,m:0,e:0x2277aa}, blanco_proto:{c:0xebe9e2,r:.6,m:0},
  azul_linea:{c:0x2b5fd0,r:.6,m:0}, pcb_rojo:{c:0xb02536,r:.45,m:0}, negro_cap:{c:0x1d2836,r:.4,m:.1}, resistencia:{c:0xcdb68a,r:.5,m:0},
  pcb_verde:{c:0x2b8a4c,r:.45,m:0}, led_rojo:{c:0xff4a3d,r:.2,m:0,e:0x661511}, transparente:{c:0xd5e6ee,r:.1,m:0,o:.2}
};
const FIL = [['azul','PETG azul','marco, carro, brazo, soporte y piñón; vasos'],['negro','PLA+ negro','tolva, pista, embudo, barra dentada'],
             ['marmol','PLA+ mármol','riel, compuerta, cuna del servo, cartucho'],['verde','PLA verde','disco y adaptador del sensor']];
const hex = n => '#' + n.toString(16).padStart(6, '0');

// ---------------------------------------------------------------- escena
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, stage.firstChild);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 5, 12000); camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .12; controls.maxDistance = 5000; controls.minDistance = 40;

// entorno suave para los metales
(function(){
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
  const g = new THREE.SphereGeometry(100, 32, 16), col = [], p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const z = p.getZ(i) / 100, k = .45 + .5 * Math.max(0, z); col.push(k, k * 1.02, k * 1.06); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide})));
  const lamp = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshBasicMaterial({color:0xffffff}));
  lamp.position.set(0, 0, 95); es.add(lamp); es.rotation.x = Math.PI / 2;
  scene.environment = pm.fromScene(es, .04).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, .55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(500, -700, 1100); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left:-1000, right:1000, top:700, bottom:-700, near:100, far:3000}); sun.shadow.bias = -.0004;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xdfe8ff, .45); fill.position.set(-600, 500, 400); scene.add(fill);

// mesa
const mesa = new THREE.Group(); scene.add(mesa);
(function(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#a9875f'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${120 + Math.random() * 40},${90 + Math.random() * 30},60,${.05 + Math.random() * .08})`; x.lineWidth = 1 + Math.random() * 3; const y = Math.random() * 512; x.beginPath(); x.moveTo(0, y); x.bezierCurveTo(170, y + Math.random() * 14 - 7, 340, y + Math.random() * 14 - 7, 512, y + Math.random() * 10 - 5); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 1.4); t.encoding = THREE.sRGBEncoding;
  const top = new THREE.Mesh(new THREE.BoxGeometry(1900, 800, 18), new THREE.MeshStandardMaterial({map:t, roughness:.75}));
  top.position.set(-40, -60, -9.05); top.receiveShadow = true; mesa.add(top);
})();

const G = {e1:new THREE.Group(), e2:new THREE.Group(), elec:new THREE.Group(), cab:new THREE.Group()};
const carroG = new THREE.Group(), cartG = new THREE.Group();
G.e2.add(carroG); G.e1.add(cartG);
Object.values(G).forEach(g => scene.add(g));
const porId = {}, clicables = [], mats = {};
function material(k, xray) {
  const key = k + (xray ? '_x' : '');
  if (mats[key]) return mats[key];
  const s = MAT[k] || MAT.negro;
  const m = new THREE.MeshStandardMaterial({color:s.c, roughness:s.r, metalness:s.m, envMapIntensity:.9,
    transparent:!!(s.o || xray), opacity:xray ? .14 : (s.o || 1), depthWrite:!(xray || (s.o && s.o < .5)), shadowSide:THREE.FrontSide, side:THREE.DoubleSide,
    emissive:s.e || 0, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  m.color.convertSRGBToLinear(); if (s.e) m.emissive.convertSRGBToLinear();
  return mats[key] = m;
}
function geo(p) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(p.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(p.t, Uint32Array), 1));
  g.computeVertexNormals(); return g;
}
const ESTRUCT = [];
let disco = null, comp = null, pinon = null;
for (const p of D.piezas) {
  const mesh = new THREE.Mesh(geo(p), material(p.mat)); mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = {id:p.id, n:p.n, mat:p.mat, g:p.g};
  let padre = p.g === 'elec' ? G.elec : (p.mov ? (p.g === 'e1' ? cartG : carroG) : G[p.g]);
  if (p.rot) {
    const piv = new THREE.Group(); piv.position.set(...p.rot.o);
    if (p.rot.u) { piv.matrixAutoUpdate = false; piv.matrix.makeBasis(new THREE.Vector3(...p.rot.u), new THREE.Vector3(...p.rot.w), new THREE.Vector3(...p.rot.n)).setPosition(...p.rot.o); }
    const giro = new THREE.Group(); piv.add(giro); giro.add(mesh); padre.add(piv);
    if (p.id === 'H02') disco = giro; else if (p.id === 'G02') comp = giro; else if (p.id === 'PI') pinon = giro;
  } else padre.add(mesh);
  if (p.g !== 'elec') ESTRUCT.push(mesh);
  (porId[p.id] = porId[p.id] || []).push(mesh); clicables.push(mesh);
}

// ---------------------------------------------------------------- cables
const COLC = {rojo:0xd2302a, negro:0x1b1b1b, amarillo:0xf3c623, naranja:0xf07f1a, azul:0x2f5fd8, rosa:0xf08fb0, verde:0x2fa64a, blanco:0xf2f2f2, gris:0x8d949a, violeta:0x7e4bd1, marron:0x7a4a26};
const cabMat = {};
for (const c of D.cables) {
  const pts = c.p.map(q => new THREE.Vector3(...q));
  const n = c.c.length, curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', .5);
  const fr = curve.computeFrenetFrames(160, false);
  c.c.forEach((col, i) => {
    const off = (i - (n - 1) / 2) * 1.35;
    const sp = curve.getSpacedPoints(160).map((q, k) => q.clone().addScaledVector(fr.normals[k], off));
    const cv = new THREE.CatmullRomCurve3(sp);
    const m = cabMat[col] || (cabMat[col] = (() => { const mm = new THREE.MeshStandardMaterial({color:COLC[col], roughness:.45}); mm.color.convertSRGBToLinear(); return mm; })());
    const tube = new THREE.Mesh(new THREE.TubeGeometry(cv, 200, .62, 6, false), m); tube.castShadow = true;
    tube.userData = {cable:c}; G.cab.add(tube);
  });
}

// ---------------------------------------------------------------- electrónica: fichas
const A = D.anclas;
const ELEC = [
  ['ESP','ESP32-S3 DevKitC-1','Cerebro del sistema. USB-C al PC para cargar el firmware.'],
  ['EX','Placa de expansión','Jack de 12 V y regulador a 5 V para el servo y el 28BYJ-48.'],
  ['FU','Fuente 12 V 2 A','Al jack de la placa de expansión.'],
  ['PB','Protoboard 400 puntos','Rieles de 5 V, 3,3 V y GND; lleva el A4988.'],
  ['A4','Driver A4988','STEP GPIO 10 · DIR 11 · EN 12 · 1/16 de paso · Vref para 1,2 A.'],
  ['CP','Condensador 100 µF','Entre VMOT y GND, pegado al A4988.'],
  ['RS','Resistencias','330 Ω en serie con cada LED IR; 10 kΩ de carga en cada fototransistor.'],
  ['UL','Driver ULN2003','IN1 a IN4 = GPIO 4, 5, 6, 7 · 5 V.'],
  ['M1','Motor 28BYJ-48','Gira el disco de la tolva. Conector de 5 hilos al ULN2003.'],
  ['TC','Sensor TCS3200','OUT 14 · S2 16 · S3 17 · S0 18 · S1 21 · OE a GND · 3,3 V.'],
  ['IE1','LED IR, barrera 1','Detrás de la pista, en el porta-emisor B01. 5 V con 330 Ω.'],
  ['IR1','Fototransistor, barrera 1','Poste delantero de la pista. Señal a GPIO 1.'],
  ['IE2','LED IR, barrera 2','24 mm después de la barrera 1. 5 V con 330 Ω.'],
  ['IR2','Fototransistor, barrera 2','Señal a GPIO 2.'],
  ['SV','Servo SG90','Compuerta bajo el embudo. Señal GPIO 15 · 5 V · GND.'],
  ['K1','Motor NEMA17','Mueve el piñón y la barra dentada. Bobinas 1A 1B 2A 2B al A4988.'],
  ['IE3','LED IR de referencia','Poste del riel, lado de los vasos. 5 V con 330 Ω.'],
  ['IR3','Fototransistor de referencia','Poste del riel, lado del motor. Cero de la banda en GPIO 13.'],
  ['BA','Caja de la electrónica','Detrás de la torre junto al motor de la banda. Los cables suben por la pata del caballete 1.']
];
const ELN = {}; ELEC.forEach((e, i) => ELN[e[0]] = i + 1);
const NOMMAT = {azul:'PETG azul', negro:'PLA+ negro', marmol:'PLA+ mármol', verde:'PLA verde'};
$('lista').innerHTML = ELEC.map((e, i) => `<div class="el" tabindex="0" role="button" data-id="${e[0]}"><span class="n">${i + 1}</span><span class="nm">${e[1]}</span><span class="pn">${e[2]}</span></div>`).join('');
$('fil').innerHTML = FIL.map(f => `<i style="background:${hex(MAT[f[0]].c)}"></i><span><b>${f[1]}</b> · ${f[2]}</span>`).join('');

// etiquetas en pantalla
const lblBox = $('lbl'), labels = [];
function etiqueta(texto, num, pos, obj, clase, id) {
  const el = document.createElement('div'); el.className = 'lb ' + (clase || '');
  const st = {A4:58, PB:30, CP:20, RS:8, ESP:34, EX:12, UL:30, IE1:30, IR1:52, IE2:14, IR2:72, TC:40, FU:18}[id] || 18;
