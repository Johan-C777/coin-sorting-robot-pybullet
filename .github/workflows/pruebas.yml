name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (monedas, obstáculos, cinemática, planificador, protocolo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar pytest
        run: pip install pytest
      - name: Correr las pruebas
        run: pytest software/tests -q
      - name: Alcance de los puestos
        run: python scripts/verificar_alcance.py

  firmware:
    name: Núcleo de los firmwares en el PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y correr
        run: make -C firmware/tests

  clasificador:
    name: Firmware del clasificador (etapa 1) · PlatformIO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/etapa1_clasificador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/etapa1_clasificador/platformio.ini') }}
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Pruebas unitarias en el PC (Unity)
        run: pio test -e native
      - name: Compilar para ESP32-S3
        run: pio run -e esp32s3
      - name: Tamaño del binario
        run: pio run -e esp32s3 -t size
